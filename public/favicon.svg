<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Top Face Gradient (Bright Highlight) -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFF5D6" />
      <stop offset="100%" stop-color="#FFD369" />
    </linearGradient>

    <!-- Front Face Gradient (Vibrant Gold Theme) -->
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD369" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Right Side 3D Extrusion Gradient -->
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="60%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Underhang / Bottom Depth Gradient -->
    <linearGradient id="underGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
  </defs>

  <g>
    <!-- 1. TOP 3D FACES (Upper extrusion) -->
    <!-- Top bar top face -->
    <polygon points="4,18 12,8 96,8 88,18" fill="url(#topGrad)" />
    <!-- Top bar left side face -->
    <polygon points="4,18 12,8 12,28 4,38" fill="url(#topGrad)" opacity="0.8" />

    <!-- 2. UNDERHANG 3D FACES -->
    <!-- Left underhang under top bar -->
    <polygon points="4,38 12,28 36,28 36,38" fill="url(#underGrad)" />
    <!-- Right underhang under top bar -->
    <polygon points="62,38 70,28 96,28 88,38" fill="url(#underGrad)" />
    <!-- Bottom of stem -->
    <polygon points="36,96 44,86 70,86 62,96" fill="url(#underGrad)" />

    <!-- 3. RIGHT SIDE 3D FACES (Depth extrusion) -->
    <!-- Top bar right face -->
    <polygon points="88,18 96,8 96,28 88,38" fill="url(#sideGrad)" />
    <!-- Stem right face -->
    <polygon points="62,38 70,28 70,86 62,96" fill="url(#sideGrad)" />

    <!-- 4. FRONT FACE (Main T) -->
    <!-- Top Bar -->
    <rect x="4" y="18" width="84" height="20" rx="2" fill="url(#frontGrad)" />
    <!-- Vertical Stem -->
    <rect x="36" y="38" width="26" height="58" rx="2" fill="url(#frontGrad)" />

    <!-- Crisp Top Highlight Bevel -->
    <line x1="6" y1="19.5" x2="86" y2="19.5" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round" />
    <line x1="37.5" y1="39" x2="37.5" y2="94" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
